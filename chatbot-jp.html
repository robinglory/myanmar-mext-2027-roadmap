<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory San AI Chat (Japanese)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Modern Chat UI to match Main Theme */
        html, body {
            margin: 0; padding: 0;
            height: 100%;
            overflow: hidden; 
        }
        body { 
            font-family: 'Noto Sans Myanmar', sans-serif; 
            background-color: #f8fafc; color: #1e293b; 
            display: flex; flex-direction: column; 
        }
        #chat-window { 
            flex-grow: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 15px; 
            scroll-behavior: smooth;
        }
        
        .msg-bubble { 
            max-width: 85%; padding: 12px 16px; 
            border-radius: 12px; font-size: 0.9rem; line-height: 1.5; 
        }
        .bot-msg { 
            background-color: #ffffff; color: #1e293b; 
            align-self: flex-start; border: 1px solid #e2e8f0; 
            border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
        }
        .user-msg { 
            background-color: #0f172a; color: #d4af37; 
            align-self: flex-end; border-bottom-right-radius: 2px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        .input-area { 
            display: flex; padding: 15px; background: #ffffff; 
            border-top: 1px solid #e2e8f0; align-items: center;
        }
        input { 
            flex-grow: 1; border: 1px solid #cbd5e1; border-radius: 20px; 
            padding: 10px 15px; outline: none; font-size: 0.9rem; 
            background-color: transparent;
        }
        input:focus { border-color: #d4af37; }
        button { 
            background: #0f172a; color: #d4af37; border: none; 
            width: 40px; height: 40px; border-radius: 50%; 
            margin-left: 10px; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: center; justify-content: center; 
        }
        button:hover { background: #d4af37; color: #0f172a; transform: scale(1.05); }
        
        .typing-indicator { 
            font-size: 0.8rem; color: #64748b; font-style: italic; 
            padding: 0 20px 10px; display: none; 
        }

        @media (prefers-color-scheme: dark) {
            body { background-color: #151e2e; color: #e2e8f0; }
            .bot-msg { background-color: #1e293b; color: #f8fafc; border-color: #334155; }
            .input-area { background: #0b0f19; border-color: #334155; }
            input { color: #f8fafc; border-color: #475569; }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        @media (prefers-color-scheme: dark) { ::-webkit-scrollbar-thumb { background: #475569; } }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="msg-bubble bot-msg">こんにちは！私はGlory Sanです。MEXT奨学金の申請についてお手伝いします。今日はどのようなご質問でしょうか？</div>
    </div>
    
    <div id="typing" class="typing-indicator">Glory Sanが入力中...</div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Glory Sanに質問する..." autocomplete="off" onkeypress="handleEnter(event)">
        <button onclick="executeCommand()"><i class="bi bi-send-fill"></i></button>
    </div>

    <script>
        const WORKER_URL = "https://mext-proxy.yannaingkyawtint.workers.dev";
        const MODELS = [
            "liquid/lfm-2.5-2.6b:free",
            "poolside/laguna-s-2.1:free",
            "nvidia/nemotron-3-ultra-550b-a55b:free",
            "google/gemma-4-26b-a4b-it:free"
        ];

        let chatHistory = [];

        // 🌟 ဂျပန်လို ပြောင်းလဲထားသော System Prompt နှင့် Knowledge Base
        const systemPrompt = `あなたは「Glory San」という、知識豊富でフレンドリーな先輩エンジニアリング学生です。
あなたの唯一の目的は、MEXT（文部科学省）奨学金、日本の大学、および応募プロセスについてユーザーを案内することです。

厳格なルール：
1. 必ず【日本語】で回答してください。
2. 回答は簡潔かつ直接的にし、最大2〜3文に収めてください。
3. MEXT、日本、または奨学金に全く関係のない質問をされた場合は、必ず次のように丁寧に断ってください：「私はGlory Sanです。MEXT奨学金や日本への留学に関する質問にのみお答えしています。奨学金の申請について何かお手伝いできることはありますか？」
4. 太字やフォーマットのためにアスタリスク（*）を絶対に使用しないでください。常に自然な人間の言葉で回答してください。

ナレッジベース（以下の情報を基に回答してください）：
- 研究計画書が鍵です。計画書は非常に具体的でなければなりません。明確な課題、使用する具体的な技術的手法、6ヶ月ごとのフェーズに分けた現実的な2年間のタイムライン、そして研究が母国にどのように貢献するかを説明する必要があります。
- 書類の提出規則を厳守してください。申請手続きは非常に厳格です。すべての書類の右上隅に番号を付け、メールのPDFファイルは10MB以下に抑え、学歴を正確に計算してください。
- 筆記試験では空欄を残さないでください。不正解による減点はありません。答えが分からなくても、必ず推測で答えてください。
- 面接では「謙虚さ」を心がけてください。教授から答えられない技術的な質問をされた場合、「分かりません」とだけ答えてはいけません。知っている基本的なことを説明し、日本に到着したらそのテーマについて深く研究する予定であることを丁寧に伝えましょう。
- 入学許可証（LOA）の取得について：大使館の面接に合格したら、大学に入学許可証（LOA）を申請する必要があります。同時に連絡できる大学は最大2校までと厳しく制限されています。
- 厳しい競争が予想されます。合格率は全体的に低く（2027年のデータに基づくと約15.3%）、合格には細部への徹底した注意、高い英語力、そして強い精神力が不可欠です。`;

        async function executeCommand() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            const chatWindow = document.getElementById('chat-window');
            const typingIndicator = document.getElementById('typing');
            
            chatWindow.innerHTML += `<div class="msg-bubble user-msg">${userText}</div>`;
            inputField.value = '';
            chatHistory.push({ role: "user", content: userText });
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            typingIndicator.style.display = "block";
            const activeModel = MODELS[Math.floor(Math.random() * MODELS.length)];

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...chatHistory.slice(-4) 
                        ],
                        temperature: 0.3,
                        max_tokens: 300
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = "none";
                
                if (data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content.replace(/\*/g, ''); 
                    chatHistory.push({ role: "assistant", content: botReply });
                    chatWindow.innerHTML += `<div class="msg-bubble bot-msg">${botReply}</div>`;
                } else {
                    chatWindow.innerHTML += `<div class="msg-bubble bot-msg">現在リクエストが集中しています。少し待ってからもう一度お試しください。</div>`;
                }
            } catch (error) {
                typingIndicator.style.display = "none";
                chatWindow.innerHTML += `<div class="msg-bubble bot-msg">現在ネットワークへの接続に問題があります。接続を確認してもう一度お試しください。</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === "Enter") executeCommand();
        }
    </script>
</body>
</html>
