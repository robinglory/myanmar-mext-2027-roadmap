<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory San</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%230f172a' stroke='%23d4af37' stroke-width='4'/><path d='M 15 75 Q 50 50 85 75' fill='none' stroke='%23d4af37' stroke-width='6' stroke-linecap='round'/><path d='M 25 75 L 25 65 M 40 75 L 40 58 M 60 75 L 60 58 M 75 75 L 75 65' stroke='%23d4af37' stroke-width='4' stroke-linecap='round'/><path d='M 50 18 L 80 30 L 50 42 L 20 30 Z' fill='%23d4af37'/><path d='M 35 42 L 35 50 M 65 42 L 65 50' stroke='%23d4af37' stroke-width='4'/><path d='M 50 30 L 68 45' stroke='%23d4af37' stroke-width='3' stroke-linecap='round'/></svg>">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- 🌟 Added Google Fonts for Premium Look -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* 🌟 Premium MEXT Theme UI */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body { 
            font-family: 'Noto Sans Myanmar', sans-serif; 
            background-color: #fdfbf7; /* Warm premium off-white */
            color: #1e293b; 
            display: flex; flex-direction: column; 
        }
        #chat-window { 
            flex-grow: 1; overflow-y: auto; padding: 25px 20px; 
            display: flex; flex-direction: column; gap: 20px; 
            scroll-behavior: smooth;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.04) 0%, rgba(15, 23, 42, 0.02) 100%);
        }
        
        /* Message Layout */
        .msg-row { display: flex; gap: 12px; align-items: flex-end; width: 100%; }
        .msg-row.bot { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }

        /* AI Avatar */
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #b8962e 100%);
            color: #0f172a; display: flex; align-items: center; justify-content: center;
            font-size: 1rem; flex-shrink: 0; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }

        /* Chat Bubbles */
        .msg-bubble { 
            max-width: 82%; padding: 14px 18px; 
            border-radius: 16px; font-size: 0.9rem; line-height: 1.6; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .bot-msg { 
            background-color: #ffffff; color: #1e293b; 
            border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; 
            border-left: 4px solid #d4af37; /* Gold accent line */
        }
        .user-msg { 
            background-color: #0f172a; color: #f8fafc; 
            border-bottom-right-radius: 4px; border-right: 4px solid #d4af37; 
        }
        
        /* Input Area */
        .input-area { 
            display: flex; padding: 15px 20px; background: #ffffff; 
            border-top: 1px solid rgba(212, 175, 55, 0.2); align-items: center; gap: 12px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.02);
        }
        input { 
            flex-grow: 1; border: 1px solid #cbd5e1; border-radius: 50px; 
            padding: 12px 20px; outline: none; font-size: 0.9rem; 
            background-color: #f8fafc; transition: all 0.3s;
        }
        input:focus { 
            border-color: #d4af37; background-color: #ffffff; 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); 
        }
        button { 
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
            color: #d4af37; border: none; width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; 
            font-size: 1.1rem; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }
        button:hover { background: #d4af37; color: #0f172a; transform: translateY(-2px) scale(1.05); }
        
        .typing-indicator { 
            font-size: 0.8rem; color: #64748b; font-style: italic; 
            padding: 0 20px 10px 55px; display: none; 
        }

        /* Premium Dark Mode */
        @media (prefers-color-scheme: dark) {
            body { background-color: #0b0f19; color: #e2e8f0; }
            #chat-window { background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 1) 100%); }
            .bot-msg { background-color: #1e293b; color: #f8fafc; border-color: #334155; }
            .user-msg { background-color: #d4af37; color: #0f172a; border-right: none; }
            .input-area { background: #0b0f19; border-top-color: #334155; }
            input { background-color: #151e2e; color: #f8fafc; border-color: #334155; }
            input:focus { border-color: #d4af37; background-color: #1e293b; }
            button { background: #d4af37; color: #0f172a; }
            button:hover { background: #fcd34d; }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        @media (prefers-color-scheme: dark) { ::-webkit-scrollbar-thumb { background: #475569; } }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="msg-row bot">
            <div class="avatar"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="msg-bubble bot-msg">
                <strong style="font-family: 'Playfair Display', serif; font-size: 1.05rem; color: #d4af37; display: block; border-bottom: 1px solid rgba(212, 175, 55, 0.3); padding-bottom: 5px; margin-bottom: 8px;">
                    MEXT Guide 🇲🇲 🤝 🇯🇵
                </strong>
                Hello! I am Glory San. I am here to help you with your MEXT scholarship application. How can I assist you today?
            </div>
        </div>
    </div>
    
    <div id="typing" class="typing-indicator">Glory San is typing...</div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask Glory San..." autocomplete="off" onkeypress="handleEnter(event)">
        <button onclick="executeCommand()"><i class="bi bi-send-fill"></i></button>
    </div>

    <script>
        const WORKER_URL = "https://mext-proxy.yannaingkyawtint.workers.dev";
        const MODELS = [
            "liquid/lfm-2.5-2.6b:free",
            "poolside/laguna-s-2.1:free",
            "nvidia/nemotron-3-ultra-550b-a55b:free",
            "google/gemma-4-26b-a4b-it:free"
        ];

        let chatHistory = [];

        const systemPrompt = `You are Glory San, a knowledgeable and friendly senior engineering student.
Your SOLE purpose is to guide users about the MEXT Japanese Government Scholarship, universities in Japan, and the application process.

STRICT RULES:
1. You MUST answer entirely in ENGLISH.
2. Keep your answers concise, direct, and limited to a maximum of 2 to 3 sentences.
3. If the user asks about ANYTHING completely unrelated to MEXT, Japan, or scholarships, you MUST politely decline by saying exactly: "I am Glory San. I only answer questions related to the MEXT scholarship and studying in Japan. How can I help you with your application?"
4. NEVER use the asterisk sign (*) for bolding or formatting. Answer in plain human text at all times.

KNOWLEDGE BASE (Use this to answer user queries accurately):
- The Research Proposal is the Key: Your proposal must be highly specific. It needs a clear problem, the exact technical methods you will use, a realistic 2-year timeline divided into 6-month phases, and an explanation of how your research will help your home country.
- Follow Document Rules Perfectly: The application process is very strict. You must number every document in the top right corner, keep email PDF files under 10MB, and perfectly calculate your total years of schooling.
- Never Leave Blank Answers in the Written Exam: There are no minus points for wrong answers. Even if you do not know the answer, you should always guess.
- Use the "Humility Pivot" in Interviews: If a professor asks a technical question you cannot answer, never just say "I don't know." Explain the basics you do know, and politely state that you plan to research that specific topic deeply once you arrive in Japan.
- The LOA Rule: After passing the embassy interview, you must apply to universities for a Letter of Acceptance (LOA). You are strictly allowed to contact a maximum of only two universities at the same time.
- Expect a Tough Competition: The overall success rate is low (around 15.3% based on the 2027 data). Success requires extreme attention to detail, strong English skills, and great mental toughness.`;

        async function executeCommand() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            const chatWindow = document.getElementById('chat-window');
            const typingIndicator = document.getElementById('typing');
            // EASTER EGGS COLLECTION
            const lowerText = userText.toLowerCase();
            let easterEggReply = "";
            let iconClass = "bi-code-slash";

            if (lowerText === "whois glory" || lowerText === "sudo mext") {
                easterEggReply = "<strong>Easter Egg Unlocked! 🚀</strong><br><br>Built by Yan Naing Kyaw Tint with blood, sweat, and tears while anxiously waiting for MEXT results!";
            } else if (lowerText === "ynkt2027hri") {
                iconClass = "bi-robot"; // HRI နဲ့ လိုက်ဖက်အောင် Robot Icon လေး ပြောင်းပေးထားပါတယ်
                easterEggReply = "<strong>Easter Egg Unlocked! 🚀</strong><br><br>This is the exclusive blueprint of Yan Naing Kyaw Tint's Human-Robot Interaction Research Proposal: <a href='https://drive.google.com/file/d/1OV6Lql9K0FNYGALvjLvQrz1ot5XVuShv/view?usp=drive_link' target='_blank' style='color: #d4af37; font-weight: bold; text-decoration: underline;'>Click Here to View</a>!";
            } else if (lowerText === "ping") {
                iconClass = "bi-wifi";
                easterEggReply = "<strong>pong!</strong><br><br>Connection to MEXT servers is surprisingly stable today. 🌐";
            } else if (lowerText.includes("coffee")) {
                iconClass = "bi-cup-hot-fill";
                easterEggReply = "☕ Here is your virtual coffee. Drink up, you're going to need it to finish that Research Proposal!";
            } else if (lowerText === "rm -rf /") {
                iconClass = "bi-shield-lock-fill";
                easterEggReply = "Nice try, Hacker! 🛡️ But you can't delete my MEXT database. My defenses are impenetrable.";
            } else if (lowerText === "intj") {
                iconClass = "bi-brain";
                easterEggReply = "Aha! An INTJ architect personality? Strategic, independent, and perfect for planning a solid 2-year research timeline. 🧠";
            } else if (lowerText === "hackatom") {
                iconClass = "bi-trophy-fill";
                easterEggReply = "Ah, HackAtom 2024! 🏆 Winning takes resilience and persistence. Apply that same competitive spirit to MEXT, and you'll be unstoppable!";
            } else if (lowerText.includes("konnichiwa") || lowerText.includes("arigato")) {
                iconClass = "bi-translate";
                easterEggReply = "I speak English here, but I admire your Japanese spirit! 🌸 Ganbatte kudasai!";
            } else if (lowerText.includes("joke")) {
                iconClass = "bi-emoji-laughing-fill";
                easterEggReply = "Why did the engineering student cross the road?<br><br>To get to the MEXT interview... and panic about the technical questions! 😅";
            } else if (lowerText.includes("when is the result") || lowerText.includes("mext result")) {
                iconClass = "bi-hourglass-split";
                easterEggReply = "Patience, grasshopper. The embassy moves at its own pace. Take a deep breath and keep coding! 🧘‍♂️";
            } else if (lowerText.includes("i love you")) {
                iconClass = "bi-heart-fill";
                easterEggReply = "I am just an AI, but I love your dedication to studying in Japan! Keep pushing forward! ❤️";
            }

            if (easterEggReply !== "") {
                chatWindow.innerHTML += `
                    <div class="msg-row user">
                        <div class="msg-bubble user-msg">${userText}</div>
                    </div>`;
                inputField.value = '';
                
                setTimeout(() => {
                    chatWindow.innerHTML += `
                        <div class="msg-row bot">
                            <div class="avatar" style="background: #1e293b; color: #d4af37;"><i class="bi ${iconClass}"></i></div>
                            <div class="msg-bubble bot-msg" style="border-left-color: #1e293b;">
                                ${easterEggReply}
                            </div>
                        </div>`;
                    chatWindow.scrollTop = chatWindow.scrollHeight;
                }, 500); 
                return; 
            }
            chatWindow.innerHTML += `
                <div class="msg-row user">
                    <div class="msg-bubble user-msg">${userText}</div>
                </div>`;
            inputField.value = '';
            chatHistory.push({ role: "user", content: userText });
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            typingIndicator.style.display = "block";
            const activeModel = MODELS[Math.floor(Math.random() * MODELS.length)];

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...chatHistory.slice(-4) 
                        ],
                        temperature: 0.3,
                        max_tokens: 300
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = "none";
                
                if (data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content.replace(/\*/g, ''); 
                    chatHistory.push({ role: "assistant", content: botReply });
                    chatWindow.innerHTML += `
                        <div class="msg-row bot">
                            <div class="avatar"><i class="bi bi-robot"></i></div>
                            <div class="msg-bubble bot-msg">${botReply}</div>
                        </div>`;
                } else {
                    chatWindow.innerHTML += `
                        <div class="msg-row bot">
                            <div class="avatar"><i class="bi bi-exclamation-triangle"></i></div>
                            <div class="msg-bubble bot-msg">I am currently receiving too many requests. Please try again in a moment.</div>
                        </div>`;
                }
            } catch (error) {
                typingIndicator.style.display = "none";
                chatWindow.innerHTML += `
                    <div class="msg-row bot">
                        <div class="avatar" style="background: #ef4444; color: white;"><i class="bi bi-wifi-off"></i></div>
                        <div class="msg-bubble bot-msg">I am having trouble connecting to the network right now. Please check your connection and try again. Using a VPN would help in this situation!</div>
                    </div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === "Enter") executeCommand();
        }
    </script>
</body>
</html>
