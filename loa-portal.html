<body class="loa-page-bg">

    <!-- 🌟 DYNAMIC HERO SECTION WITH NEW BACKGROUND -->

        <div class="container text-center position-relative z-2">

                <span class="text-warning small fw-bold tracking-wider">PHASE 2 : EXCLUSIVE ACCESS</span>
            </div>
            
            <h1 class="serif-font fw-bold text-white mb-3" style="font-size: 2.8rem;">University LOA Portal</h1>
            
            <p class="text-light mx-auto mb-4" style="max-width: 600px; opacity: 0.85; font-size: 1rem; line-height: 1.7;">

            </p>
            
            <a href="index.html" class="btn btn-outline-light rounded-pill px-4 py-2" style="font-size: 0.9rem;">
                <i class="bi bi-arrow-left me-2"></i> Main Roadmap သို့ ပြန်သွားရန်
            </a>
        </div>
    </header>

        <div class="row g-3 justify-content-center" id="university-grid">
            <!-- Cards will be injected here automatically -->
        </div>
    </main>

    <!-- Modal for Reading Markdown -->
    <div class="modal fade" id="markdownModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 25px 50px rgba(0,0,0,0.3);">
                <div class="modal-header bg-dark text-white" style="border-radius: 16px 16px 0 0; padding: 20px 30px;">
                    <h5 class="modal-title serif-font text-warning" id="mdModalTitle">Document</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 p-md-5">
                    <div id="mdModalBody" class="markdown-body"></div>
                </div>
                <div class="modal-footer bg-light" style="border-radius: 0 0 16px 16px; padding: 15px 30px;">
                    <button type="button" class="btn btn-dark rounded-pill px-4" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
