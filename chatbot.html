<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory San AI Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Modern Chat UI to match Main Theme */
        html, body {
            margin: 0; padding: 0;
            height: 100%;
            overflow: hidden; 
        }
        body { 
            font-family: 'Noto Sans Myanmar', sans-serif; 
            background-color: #f8fafc; color: #1e293b; 
            display: flex; flex-direction: column; 
        }
        #chat-window { 
            flex-grow: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 15px; 
            scroll-behavior: smooth;
        }
        
        /* Chat Bubbles */
        .msg-bubble { 
            max-width: 85%; padding: 12px 16px; 
            border-radius: 12px; font-size: 0.9rem; line-height: 1.5; 
        }
        .bot-msg { 
            background-color: #ffffff; color: #1e293b; 
            align-self: flex-start; border: 1px solid #e2e8f0; 
            border-bottom-left-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); 
        }
        .user-msg { 
            background-color: #0f172a; color: #d4af37; 
            align-self: flex-end; border-bottom-right-radius: 2px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        
        /* Input Area */
        .input-area { 
            display: flex; padding: 15px; background: #ffffff; 
            border-top: 1px solid #e2e8f0; align-items: center;
        }
        input { 
            flex-grow: 1; border: 1px solid #cbd5e1; border-radius: 20px; 
            padding: 10px 15px; outline: none; font-size: 0.9rem; 
            background-color: transparent;
        }
        input:focus { border-color: #d4af37; }
        button { 
            background: #0f172a; color: #d4af37; border: none; 
            width: 40px; height: 40px; border-radius: 50%; 
            margin-left: 10px; cursor: pointer; transition: 0.2s; 
            display: flex; align-items: center; justify-content: center; 
        }
        button:hover { background: #d4af37; color: #0f172a; transform: scale(1.05); }
        
        .typing-indicator { 
            font-size: 0.8rem; color: #64748b; font-style: italic; 
            padding: 0 20px 10px; display: none; 
        }

        /* Auto Dark Mode Integration */
        @media (prefers-color-scheme: dark) {
            body { background-color: #151e2e; color: #e2e8f0; }
            .bot-msg { background-color: #1e293b; color: #f8fafc; border-color: #334155; }
            .input-area { background: #0b0f19; border-color: #334155; }
            input { color: #f8fafc; border-color: #475569; }
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        @media (prefers-color-scheme: dark) { ::-webkit-scrollbar-thumb { background: #475569; } }
    </style>
</head>
<body>

    <div id="chat-window">
        <div class="msg-bubble bot-msg">Hello! I am Glory San. I am here to help you with your MEXT scholarship application. How can I assist you today?</div>
    </div>
    
    <div id="typing" class="typing-indicator">Glory San is typing...</div>
    
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask Glory San..." autocomplete="off" onkeypress="handleEnter(event)">
        <button onclick="executeCommand()"><i class="bi bi-send-fill"></i></button>
    </div>

    <script>
        const WORKER_URL = "https://mext-proxy.yannaingkyawtint.workers.dev";
        const MODELS = [
            "liquid/lfm-2.5-2.6b:free",
            "poolside/laguna-s-2.1:free",
            "nvidia/nemotron-3-ultra-550b-a55b:free",
            "google/gemma-4-26b-a4b-it:free"
        ];

        let chatHistory = [];

        const systemPrompt = `You are Glory San, a knowledgeable and friendly senior engineering student.
Your SOLE purpose is to guide users about the MEXT Japanese Government Scholarship, universities in Japan, and the application process.

STRICT RULES:
1. You MUST answer entirely in ENGLISH.
2. Keep your answers concise, direct, and limited to a maximum of 2 to 3 sentences.
3. If the user asks about ANYTHING completely unrelated to MEXT, Japan, or scholarships, you MUST politely decline by saying exactly: "I am Glory San. I only answer questions related to the MEXT scholarship and studying in Japan. How can I help you with your application?"
4. NEVER use the asterisk sign (*) for bolding or formatting. Answer in plain human text at all times.`;

        async function executeCommand() {
            const inputField = document.getElementById('user-input');
            const userText = inputField.value.trim();
            if (!userText) return;

            const chatWindow = document.getElementById('chat-window');
            const typingIndicator = document.getElementById('typing');
            
            chatWindow.innerHTML += `<div class="msg-bubble user-msg">${userText}</div>`;
            inputField.value = '';
            chatHistory.push({ role: "user", content: userText });
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            typingIndicator.style.display = "block";
            const activeModel = MODELS[Math.floor(Math.random() * MODELS.length)];

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: activeModel,
                        messages: [
                            { role: "system", content: systemPrompt },
                            ...chatHistory.slice(-4) 
                        ],
                        temperature: 0.3,
                        max_tokens: 300
                    })
                });

                const data = await response.json();
                typingIndicator.style.display = "none";
                
                if (data.choices && data.choices.length > 0) {
                    const botReply = data.choices[0].message.content.replace(/\*/g, ''); // Ensure no asterisks appear
                    chatHistory.push({ role: "assistant", content: botReply });
                    chatWindow.innerHTML += `<div class="msg-bubble bot-msg">${botReply}</div>`;
                } else {
                    // Polite Error for Free API Limits
                    chatWindow.innerHTML += `<div class="msg-bubble bot-msg">I am currently receiving too many requests. Please try again in a moment.</div>`;
                }
            } catch (error) {
                typingIndicator.style.display = "none";
                // Polite Error for Network Issues
                chatWindow.innerHTML += `<div class="msg-bubble bot-msg">I am having trouble connecting to the network right now. Please check your connection and try again.</div>`;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === "Enter") executeCommand();
        }
    </script>
</body>
</html>
